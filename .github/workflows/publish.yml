# Publish to npm when a version tag is pushed
# Uses OIDC trusted publishing - no NPM_TOKEN needed!
#
# One-time setup on npmjs.com (after first manual publish):
#   1. Go to package settings → Trusted publisher → GitHub Actions
#   2. Configure: org=vidaldiego, repo=zn-vault-agent, workflow=publish.yml
#   3. Click "Set up connection"
#
# Usage: git tag v2.0.0 && git push origin v2.0.0

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tagged commit is not contained in origin/main"
            exit 1
          fi

      - name: Verify version matches tag
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          FILE_VERSION=$(tr -d '\r\n' < VERSION)
          EXPECTED_VERSIONS="$TAG_VERSION|$TAG_VERSION|$TAG_VERSION|$TAG_VERSION"
          ACTUAL_VERSIONS="$PKG_VERSION|$LOCK_VERSION|$LOCK_ROOT_VERSION|$FILE_VERSION"
          if [[ "$ACTUAL_VERSIONS" != "$EXPECTED_VERSIONS" ]]; then
            echo "Release version mismatch: tag=$TAG_VERSION package=$PKG_VERSION lock=$LOCK_VERSION lock-root=$LOCK_ROOT_VERSION VERSION=$FILE_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate privileged updater wrappers
        run: |
          bash -n deploy/scripts/zn-vault-agent-update.sh
          bash -n deploy/scripts/zn-vault-plugin-update.sh

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        # Deliberately omit registry-url: setup-node would write a classic
        # _authToken stub and bypass npm Trusted Publishing via GitHub OIDC.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install OIDC-capable npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build publish candidate
        run: npm run build

      - name: Verify version matches tag
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          FILE_VERSION=$(tr -d '\r\n' < VERSION)
          EXPECTED_VERSIONS="$TAG_VERSION|$TAG_VERSION|$TAG_VERSION|$TAG_VERSION"
          ACTUAL_VERSIONS="$PKG_VERSION|$LOCK_VERSION|$LOCK_ROOT_VERSION|$FILE_VERSION"
          if [[ "$ACTUAL_VERSIONS" != "$EXPECTED_VERSIONS" ]]; then
            echo "Release version mismatch: tag=$TAG_VERSION package=$PKG_VERSION lock=$LOCK_VERSION lock-root=$LOCK_ROOT_VERSION VERSION=$FILE_VERSION"
            exit 1
          fi

      - name: Pack and verify the exact publish artifact
        id: release_artifact
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/znvault-release"
          mkdir -p "$release_dir"
          pack_json=$(npm pack --json --pack-destination "$release_dir")
          package_name=$(printf '%s' "$pack_json" | node -e "let data='';process.stdin.on('data',c=>data+=c).on('end',()=>process.stdout.write(JSON.parse(data)[0].filename))")
          if [[ -z "$package_name" || "$package_name" == */* ]]; then
            echo "npm pack returned an unsafe package filename: $package_name"
            exit 1
          fi
          package_file="$release_dir/$package_name"
          package_sha256=$(sha256sum "$package_file" | awk '{print $1}')
          echo "path=$package_file" >> "$GITHUB_OUTPUT"
          echo "sha256=$package_sha256" >> "$GITHUB_OUTPUT"
          echo "Validated publish artifact sha256=$package_sha256"
          tar -tzf "$package_file" | grep -Fx 'package/deploy/scripts/zn-vault-agent-update.sh'
          tar -tzf "$package_file" | grep -Fx 'package/deploy/scripts/zn-vault-plugin-update.sh'
          tar -tzf "$package_file" | grep -Fx 'package/deploy/systemd/zn-vault-agent-plugin-updater.service'
          tar -tzf "$package_file" | grep -Fx 'package/deploy/systemd/zn-vault-agent-plugin-updater.path'
          extract_dir=$(mktemp -d)
          tar -xzf "$package_file" -C "$extract_dir"
          bash -n "$extract_dir/package/deploy/scripts/zn-vault-agent-update.sh"
          bash -n "$extract_dir/package/deploy/scripts/zn-vault-plugin-update.sh"
          bash test/scripts/update-wrapper.bats.sh "$extract_dir/package/deploy/scripts/zn-vault-agent-update.sh"
          node test/release/packaged-plugin-updater-smoke.mjs "$extract_dir/package/deploy/scripts/zn-vault-plugin-update.sh"

      - name: Select npm release channel
        id: release_metadata
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          DIST_TAG=latest
          BASE_VERSION=${VERSION%%+*}
          if [[ "$BASE_VERSION" == *-* ]]; then
            PRERELEASE=${BASE_VERSION#*-}
            CHANNEL=${PRERELEASE%%.*}
            case "$CHANNEL" in
              beta) DIST_TAG=beta ;;
              alpha|rc|next) DIST_TAG=next ;;
              *)
                echo "Unsupported prerelease channel '$CHANNEL' in $VERSION"
                exit 1
                ;;
            esac
          elif [[ "$VERSION" == 2.* ]]; then
            # Agent 2 requires Payara plugin 3. Publishing it under latest can
            # restart opt-in 1.x fleets before the paired plugin is installed.
            # Agent 2 defaults its opt-in updater to this fenced channel. This
            # publishes the exact artifact without promoting `latest` or
            # rolling out to Agent 1. Removing the fence remains a separate,
            # verified fleet migration decision.
            DIST_TAG=dr-m4
          fi
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC)
        env:
          PACKAGE_FILE: ${{ steps.release_artifact.outputs.path }}
          PACKAGE_SHA256: ${{ steps.release_artifact.outputs.sha256 }}
        run: |
          actual_sha256=$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')
          if [[ "$actual_sha256" != "$PACKAGE_SHA256" ]]; then
            echo "Publish artifact changed after validation"
            exit 1
          fi
          npm publish "$PACKAGE_FILE" --provenance --access public --tag "${{ steps.release_metadata.outputs.dist_tag }}"
        # No NODE_AUTH_TOKEN needed - uses OIDC trusted publishing.
        # Select the dist-tag during publish so prereleases and fenced major
        # migrations never move latest.
